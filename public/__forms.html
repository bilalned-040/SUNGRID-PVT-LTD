<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SUNGRID form definitions</title>
  </head>
  <body>
    <!-- Static form blueprint used by Netlify's deploy-time form detection. -->
    <form name="quote-inquiry" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote-inquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
